version: '3.9'

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  medibook_network:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ─── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PHP-FPM (Laravel Application) ─────────────────────────────────────────────
  php-fpm:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: medibook_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-medibook_db}
      - DB_USERNAME=${MYSQL_USER:-medibook}
      - DB_PASSWORD=${MYSQL_PASSWORD:-medibook_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - LIGHTHOUSE_CACHE_ENABLE=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medibook_network

  # ── Nginx (Web Server / Reverse Proxy) ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: medibook_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/docker/nginx/logs:/var/log/nginx
    depends_on:
      - php-fpm
    networks:
      - medibook_network

  # ── MySQL 8 (Primary Database) ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: medibook_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medibook_db}
      MYSQL_USER: ${MYSQL_USER:-medibook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-medibook_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - medibook_network

  # ── Redis 7 (Cache / Queue / Sessions) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medibook_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medibook_network

  # ── React Frontend (Node.js Dev Server) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: medibook_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume to prevent host node_modules overriding container's
    environment:
      - NODE_ENV=development
      - VITE_GRAPHQL_URL=${VITE_GRAPHQL_URL:-http://localhost:8000/graphql}
      - VITE_GRAPHQL_WS_URL=${VITE_GRAPHQL_WS_URL:-ws://localhost:8000/graphql}
      - VITE_PUSHER_KEY=${VITE_PUSHER_KEY}
      - VITE_PUSHER_CLUSTER=${VITE_PUSHER_CLUSTER:-mt1}
      - VITE_APP_NAME=MediBook
    depends_on:
      - nginx
    networks:
      - medibook_network

  # ── phpMyAdmin (Database Admin UI) ────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: medibook_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      PMA_ARBITRARY: 1
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      UPLOAD_LIMIT: 50M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - medibook_network

  # ── Laravel Horizon (Queue Worker & Monitor) ───────────────────────────────────
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medibook_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=mysql
      - DB_DATABASE=${MYSQL_DATABASE:-medibook_db}
      - DB_USERNAME=${MYSQL_USER:-medibook}
      - DB_PASSWORD=${MYSQL_PASSWORD:-medibook_secret}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    command: php artisan horizon
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medibook_network
    profiles:
      - full  # Only start with: docker-compose --profile full up
