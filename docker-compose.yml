version: '3.9'

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  medibook_network:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ─── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Backend (NestJS + Apollo GraphQL + Prisma) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: medibook_backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules # anonymous volume — prevents host node_modules overriding container's
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medibook}:${POSTGRES_PASSWORD:-medibook_secret}@postgres:5432/${POSTGRES_DB:-medibook_db}
      - REDIS_URL=redis://redis:6379
      # No insecure fallback here on purpose (project-plans/02-findings-register.md
      # F-11): a deployment with no real JWT_ACCESS_SECRET/JWT_REFRESH_SECRET set
      # gets an EMPTY value, not a guessable placeholder — auth/strategies/jwt.strategy.ts
      # already throws ("JWT_ACCESS_SECRET must be set") on an empty secret, so the
      # backend fails to boot instead of silently signing tokens with a known string.
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Previously only present in backend/.env, which is NOT actually read by the
      # running container (confirmed live: process.env showed these as empty) —
      # passed explicitly here instead of relying on dotenv-loading a mounted file.
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - OTP_TTL_SECONDS=${OTP_TTL_SECONDS:-300}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medibook_network

  # ── PostgreSQL 16 (Primary Database) ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medibook_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medibook_db}
      POSTGRES_USER: ${POSTGRES_USER:-medibook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medibook_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medibook} -d ${POSTGRES_DB:-medibook_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - medibook_network

  # ── Redis 7 (OTP / refresh-token rotation / rate limiting / BullMQ) ─────────────
  redis:
    image: redis:7-alpine
    container_name: medibook_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medibook_network

  # ── React Frontend (Node.js Dev Server) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: medibook_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume to prevent host node_modules overriding container's
    environment:
      - NODE_ENV=development
      - VITE_GRAPHQL_URL=${VITE_GRAPHQL_URL:-http://localhost:4000/graphql}
      - VITE_GRAPHQL_WS_URL=${VITE_GRAPHQL_WS_URL:-ws://localhost:4000/graphql}
      - VITE_PUSHER_KEY=${VITE_PUSHER_KEY}
      - VITE_PUSHER_CLUSTER=${VITE_PUSHER_CLUSTER:-mt1}
      - VITE_APP_NAME=MediBook
    depends_on:
      - backend
    networks:
      - medibook_network
